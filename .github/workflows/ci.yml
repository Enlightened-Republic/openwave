name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # package.json "allowScripts" lets npm >= 11 run the native install
      # scripts (better-sqlite3, sqlite-vec, esbuild); older npm runs them anyway.
      - run: npm ci
      - run: npm run typecheck
      # The remote-mode suites need an xanima-server build (unpublished) and
      # skip with a warning when SHARPWAVE_SERVER_CLI is unset; everything else
      # runs against the vendored engine.
      - run: npm test
      - run: npm run build
      - name: committed control-ui hash must match the build
        run: git diff --exit-code -- openclaw.plugin.json
